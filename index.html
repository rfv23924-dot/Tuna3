<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, orientation=landscape">
    <title>Sekai Mobile Landscape</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --midnight: #000428; --pjsk-blue: #00ffee; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: var(--midnight); color: white; font-family: 'Poppins', sans-serif; overflow: hidden; touch-action: none; height: 100vh; width: 100vw; }
        
        .stars { position: absolute; width: 100%; height: 100%; background: transparent url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/123163/stars.png') repeat; z-index: 0; opacity: 0.3; }

        /* Giriş Paneli - Yatayda Daha Derli Toplu */
        #ui { 
            position: absolute; z-index: 100; padding: 20px; 
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 90%; max-width: 500px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
        }

        .input-group { text-align: left; grid-column: span 1; }
        .full-width { grid-column: span 2; }
        label { font-size: 10px; color: var(--pjsk-blue); margin-bottom: 4px; display: block; font-weight: 700; }

        input, select { 
            width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.2); 
            background: rgba(0, 0, 0, 0.4); color: white; font-size: 12px; outline: none;
        }

        button.start-btn { 
            grid-column: span 2; background: linear-gradient(45deg, var(--pjsk-blue), #00a8ff); color: #000428; 
            font-weight: 700; font-size: 16px; padding: 12px; border-radius: 12px; border: none; cursor: pointer;
        }

        /* Oyun Sahnesi */
        #gameContainer { position: fixed; top:0; left:0; width: 100%; height: 100%; display: none; background: #000; }
        #bgLayer { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; filter: brightness(0.3); z-index: 1; }
        
        /* Lane (Şeritler) - Yatayda daha geniş */
        #lanes { 
            position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); 
            width: 70%; height: 100%; display: flex; z-index: 2; 
            background: linear-gradient(to top, rgba(0,255,238,0.1), transparent); 
            border-left: 1px solid rgba(255,255,255,0.2); border-right: 1px solid rgba(255,255,255,0.2); 
        }
        .lane-line { width: 1px; height: 100%; background: rgba(255,255,255,0.1); margin: 0 auto; }
        
        #hitZone { 
            position: absolute; bottom: 60px; width: 70%; left: 50%; transform: translateX(-50%); 
            height: 4px; background: rgba(255,255,255,0.5); z-index: 3; box-shadow: 0 0 15px var(--pjsk-blue);
        }

        canvas { position: absolute; top: 0; left: 0; z-index: 4; width: 100%; height: 100%; pointer-events: none; }
        #touchHandler { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }
        #hud { position: absolute; top: 15px; width: 100%; text-align: center; z-index: 10; font-size: 30px; font-weight: 700; pointer-events: none; }
        
        #resultScreen { 
            position: absolute; z-index: 110; padding: 30px; background: rgba(0, 4, 40, 0.95); 
            border-radius: 20px; border: 2px solid var(--pjsk-blue); text-align: center; 
            top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; width: 300px; 
        }

        /* Yatay Çevir Uyarısı */
        @media (orientation: portrait) {
            #rotateMessage { display: flex; }
        }
        #rotateMessage {
            position: fixed; top:0; left:0; width: 100%; height:100%; background: var(--midnight);
            z-index: 999; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        }
    </style>
</head>
<body>

<div id="rotateMessage">
    <div style="font-size: 50px;">📱🔄</div>
    <p>Lütfen telefonu yan çevir reis!</p>
</div>

<div class="stars"></div>

<div id="ui">
    <div class="input-group">
        <label>FOTOĞRAF EKLE</label>
        <input type="file" id="bgUpload" accept="image/*">
    </div>
    <div class="input-group">
        <label>ZORLUK</label>
        <select id="diff">
            <option value="4">⭐ 1-3</option>
            <option value="6" selected>⭐⭐⭐ 5</option>
            <option value="9">⭐⭐⭐⭐⭐⭐ 8</option>
            <option value="12">🔥🔥 10</option>
        </select>
    </div>
    <div class="input-group full-width">
        <label>ŞARKI SEÇ (MP3)</label>
        <input type="file" id="musicUpload" accept="audio/*, .mp3, .m4a">
    </div>
    <button class="start-btn" onclick="startGame()">OYUNU BAŞLAT ✨</button>
</div>

<div id="resultScreen">
    <h2 style="color: var(--pjsk-blue); margin: 0;">SKOR</h2>
    <div id="resStats" style="font-size: 20px; margin: 20px 0;"></div>
    <button class="start-btn" style="width:100%" onclick="location.reload()">TEKRAR</button>
</div>

<div id="gameContainer">
    <div id="bgLayer"></div>
    <div id="lanes"><div class="lane-line"></div><div class="lane-line"></div><div class="lane-line"></div></div>
    <div id="hitZone"></div>
    <div id="hud">0</div>
    <canvas id="gameCanvas"></canvas>
    <div id="touchHandler"></div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const hud = document.getElementById('hud');
    const touchHandler = document.getElementById('touchHandler');
    let notes = [], score = 0, combo = 0, gameActive = false, audio = new Audio(), lastTime = 0, spawnTimer = 0, speed = 11, diffValue = 6;

    function startGame() {
        const musicInput = document.getElementById('musicUpload');
        const bgInput = document.getElementById('bgUpload');
        
        if (!musicInput.files[0]) return alert("Şarkıyı seçmedin reis!");

        // iPhone Dosya Okuma Garantisi
        const reader = new FileReader();
        reader.onload = function(e) {
            audio.src = e.target.result;
            audio.play().catch(() => alert("Müzik açılmadı, sayfayı yenileyip tekrar dene."));
        };
        reader.readAsDataURL(musicInput.files[0]);

        if (bgInput.files[0]) {
            const bgReader = new FileReader();
            bgReader.onload = (e) => document.getElementById('bgLayer').style.backgroundImage = `url(${e.target.result})`;
            bgReader.readAsDataURL(bgInput.files[0]);
        }
        
        diffValue = parseInt(document.getElementById('diff').value);
        document.getElementById('ui').style.display = 'none';
        document.getElementById('gameContainer').style.display = 'block';
        
        // Tam ekran talebi
        if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();

        canvas.width = window.innerWidth; 
        canvas.height = window.innerHeight;
        gameActive = true; 
        lastTime = performance.now();
        requestAnimationFrame(update);
    }

    function update(time) {
        if(!gameActive) return;
        const dt = time - lastTime; lastTime = time;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if(audio.duration > 0 && audio.currentTime >= audio.duration - 0.2) end();

        spawnTimer += dt;
        if(spawnTimer > (1000 / (diffValue / 1.5))) {
            notes.push({ lane: Math.floor(Math.random() * 4), y: -50 });
            spawnTimer = 0;
        }

        const laneWidth = (canvas.width * 0.7) / 4;
        const startX = canvas.width * 0.15;

        for(let i = notes.length - 1; i >= 0; i--) {
            let n = notes[i];
            n.y += (speed + (diffValue * 0.3)) * (dt / 16);
            
            ctx.fillStyle = "white"; 
            ctx.shadowBlur = 15; ctx.shadowColor = "#00ffee";
            ctx.fillRect(startX + (n.lane * laneWidth) + 15, n.y, laneWidth - 30, 20);
            ctx.shadowBlur = 0;

            if(n.y > canvas.height) { notes.splice(i, 1); combo = 0; hud.innerText = combo; }
        }
        requestAnimationFrame(update);
    }

    touchHandler.addEventListener('touchstart', (e) => {
        if(!gameActive) return;
        e.preventDefault();
        const touches = e.changedTouches;
        const laneWidth = (canvas.width * 0.7) / 4;
        const startX = canvas.width * 0.15;
        const hitY = canvas.height - 60;

        for(let j = 0; j < touches.length; j++) {
            const touch = touches[j];
            for(let i = notes.length - 1; i >= 0; i--) {
                let n = notes[i];
                const noteX = startX + (n.lane * laneWidth);
                if(touch.clientX > noteX && touch.clientX < noteX + laneWidth) {
                    if(Math.abs(n.y - hitY) < 90) { 
                        score += 100; combo++; hud.innerText = combo; notes.splice(i, 1);
                        break; 
                    }
                }
            }
        }
    }, {passive: false});

    function end() {
        gameActive = false; audio.pause();
        document.getElementById('gameContainer').style.display = 'none';
        document.getElementById('resultScreen').style.display = 'block';
        document.getElementById('resStats').innerText = "Skor: " + score + "\nKombo: " + combo;
    }

    // Pencere boyutu değişirse canvas'ı güncelle
    window.addEventListener('resize', () => {
        if(gameActive) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
    });
</script>
</body>
</html>
