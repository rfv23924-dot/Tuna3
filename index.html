<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, orientation=landscape">
    <title>Sekai Pro Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --midnight: #000428; --pjsk-blue: #00ffee; --pjsk-pink: #ff00ff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; padding: 0; background: var(--midnight); color: white; font-family: 'Poppins', sans-serif; overflow: hidden; touch-action: none; height: 100vh; width: 100vw; }
        
        /* Giriş Paneli */
        #ui { 
            position: absolute; z-index: 100; padding: 20px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            width: 90%; max-width: 550px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
        }
        .full-width { grid-column: span 2; }
        label { font-size: 10px; color: var(--pjsk-blue); margin-bottom: 4px; display: block; font-weight: 700; text-align: left; }
        input, select { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.5); color: white; font-size: 12px; }
        button.start-btn { grid-column: span 2; background: linear-gradient(45deg, var(--pjsk-blue), #00a8ff); color: #000428; font-weight: 900; font-size: 18px; padding: 12px; border-radius: 12px; border: none; cursor: pointer; margin-top: 5px; }

        /* Oyun HUD */
        #gameContainer { position: fixed; top:0; left:0; width: 100%; height: 100%; display: none; background: #000; }
        #bgLayer { position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center; filter: brightness(0.4); z-index: 1; }
        #rankDisplay { position: absolute; top: 20px; left: 20px; font-size: 50px; font-weight: 900; color: var(--pjsk-pink); text-shadow: 0 0 15px var(--pjsk-pink); z-index: 10; }
        #lifeBarContainer { position: absolute; top: 25px; right: 20px; width: 200px; height: 12px; background: rgba(255,255,255,0.2); border-radius: 10px; z-index: 10; border: 1px solid white; overflow: hidden; }
        #lifeBar { width: 100%; height: 100%; background: #00ff88; transition: 0.2s; }
        #scoreText { position: absolute; top: 70px; left: 20px; font-size: 20px; font-weight: 700; z-index: 10; }
        #judgmentText { position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%); font-size: 45px; font-weight: 900; z-index: 10; pointer-events: none; opacity: 0; transition: 0.1s; }

        /* Şeritler */
        #lanes { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 75%; height: 100%; display: flex; z-index: 2; background: linear-gradient(to top, rgba(0,255,238,0.1), transparent); border-left: 2px solid rgba(255,255,255,0.3); border-right: 2px solid rgba(255,255,255,0.3); }
        .lane-line { width: 1px; height: 100%; background: rgba(255,255,255,0.1); margin: 0 auto; }
        #hitZone { position: absolute; bottom: 70px; width: 75%; left: 50%; transform: translateX(-50%); height: 5px; background: white; z-index: 3; box-shadow: 0 0 20px var(--pjsk-blue); }
        
        canvas { position: absolute; top: 0; left: 0; z-index: 4; width: 100%; height: 100%; pointer-events: none; }
        #touchHandler { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }

        /* Sonuç Ekranı */
        #resultScreen { position: absolute; z-index: 110; padding: 30px; background: rgba(0, 4, 40, 0.98); border-radius: 20px; border: 3px solid var(--pjsk-blue); text-align: center; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; width: 320px; }
    </style>
</head>
<body>

<div id="ui">
    <div class="input-group"><label>FOTOĞRAF EKLE</label><input type="file" id="bgUpload" accept="image/*"></div>
    <div class="input-group">
        <label>ZORLUK (YILDIZ)</label>
        <select id="diff">
            <option value="2">⭐ 1</option><option value="3">⭐⭐ 2</option><option value="4">⭐⭐⭐ 3</option>
            <option value="5">⭐⭐⭐⭐ 4</option><option value="6" selected>⭐⭐⭐⭐⭐ 5</option>
            <option value="7">⭐⭐⭐⭐⭐⭐ 6</option><option value="8">⭐⭐⭐⭐⭐⭐⭐ 7</option>
            <option value="9">⭐⭐⭐⭐⭐⭐⭐⭐ 8</option><option value="10">⭐⭐⭐⭐⭐⭐⭐⭐⭐ 9</option>
            <option value="12">🔥🔥 10</option>
        </select>
    </div>
    <div class="input-group full-width">
        <label>ŞARKI SEÇ (SOLUK GÖRÜNÜYORSA 'GÖZ AT' DEYİN)</label>
        <input type="file" id="musicUpload" accept="audio/*, audio/mpeg, audio/mp3, audio/x-m4a, .mp3, .m4a, .wav">
    </div>
    <button class="start-btn" onclick="startGame()">DÜNYAYA GİR ✨</button>
</div>

<div id="resultScreen">
    <h1 id="finalRank" style="font-size: 80px; margin: 0; color: var(--pjsk-pink);">C</h1>
    <h3 style="margin: 0;">PERFORMANS</h3>
    <div id="resStats" style="font-size: 15px; margin: 15px 0; text-align: left; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 10px; line-height: 1.5;"></div>
    <button class="start-btn" style="width:100%" onclick="location.reload()">TEKRAR</button>
</div>

<div id="gameContainer">
    <div id="bgLayer"></div>
    <div id="rankDisplay">C</div>
    <div id="scoreText">0000000</div>
    <div id="lifeBarContainer"><div id="lifeBar"></div></div>
    <div id="judgmentText">PERFECT</div>
    <div id="lanes"><div class="lane-line"></div><div class="lane-line"></div><div class="lane-line"></div></div>
    <div id="hitZone"></div>
    <canvas id="gameCanvas"></canvas>
    <div id="touchHandler"></div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const judgmentText = document.getElementById('judgmentText');
    const lifeBar = document.getElementById('lifeBar');
    const rankDisplay = document.getElementById('rankDisplay');
    const scoreText = document.getElementById('scoreText');
    
    let notes = [], score = 0, combo = 0, life = 1000, gameActive = false;
    let stats = { perfect: 0, great: 0, meh: 0, miss: 0 };
    let audio = new Audio();
    let lastTime = 0, spawnTimer = 0, speed = 12, diffValue = 6;

    // iPhone için dosya hazırla
    document.getElementById('musicUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            audio.src = url;
            audio.load();
        }
    });

    function updateRank() {
        let rank = "D";
        if (score > 10000) rank = "C";
        if (score > 40000) rank = "B";
        if (score > 90000) rank = "A";
        if (score > 180000) rank = "S";
        rankDisplay.innerText = rank;
    }

    function showJudgment(txt, color) {
        judgmentText.innerText = txt;
        judgmentText.style.color = color;
        judgmentText.style.opacity = 1;
        setTimeout(() => judgmentText.style.opacity = 0, 300);
    }

    function startGame() {
        if (!audio.src) return alert("Müziği seçmedin veya dosya desteklenmiyor!");
        
        const bgInput = document.getElementById('bgUpload');
        if (bgInput.files[0]) {
            const reader = new FileReader();
            reader.onload = (e) => document.getElementById('bgLayer').style.backgroundImage = `url(${e.target.result})`;
            reader.readAsDataURL(bgInput.files[0]);
        }
        
        diffValue = parseInt(document.getElementById('diff').value);
        document.getElementById('ui').style.display = 'none';
        document.getElementById('gameContainer').style.display = 'block';
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        audio.play();
        gameActive = true;
        lastTime = performance.now();
        requestAnimationFrame(update);
    }

    function update(time) {
        if(!gameActive) return;
        const dt = time - lastTime; lastTime = time;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if(audio.duration > 0 && audio.currentTime >= audio.duration - 0.2) end();
        if(life <= 0) { end(); return; }

        spawnTimer += dt;
        if(spawnTimer > (1000 / (diffValue / 1.5))) {
            notes.push({ lane: Math.floor(Math.random() * 4), y: -50 });
            spawnTimer = 0;
        }

        const laneWidth = (canvas.width * 0.75) / 4;
        const startX = canvas.width * 0.125;

        for(let i = notes.length - 1; i >= 0; i--) {
            let n = notes[i];
            n.y += (speed + (diffValue * 0.25)) * (dt / 16);
            
            ctx.fillStyle = "white"; 
            ctx.shadowBlur = 15; ctx.shadowColor = "#00ffee";
            ctx.fillRect(startX + (n.lane * laneWidth) + 15, n.y, laneWidth - 30, 22);
            ctx.shadowBlur = 0;

            if(n.y > canvas.height) { 
                notes.splice(i, 1); combo = 0; life -= 100; stats.miss++;
                lifeBar.style.width = Math.max(0, life/10) + "%";
                showJudgment("MISS", "red");
            }
        }
        updateRank();
        scoreText.innerText = score.toString().padStart(7, '0');
        requestAnimationFrame(update);
    }

    document.getElementById('touchHandler').addEventListener('touchstart', (e) => {
        if(!gameActive) return;
        const touches = e.changedTouches;
        const laneWidth = (canvas.width * 0.75) / 4;
        const startX = canvas.width * 0.125;
        const hitY = canvas.height - 70;

        for(let j = 0; j < touches.length; j++) {
            const touch = touches[j];
            for(let i = notes.length - 1; i >= 0; i--) {
                let n = notes[i];
                const noteX = startX + (n.lane * laneWidth);
                if(touch.clientX > noteX && touch.clientX < noteX + laneWidth) {
                    let dist = Math.abs(n.y - hitY);
                    if(dist < 110) { 
                        if(dist < 35) { score += 500; stats.perfect++; showJudgment("PERFECT", "#00ffee"); life = Math.min(1000, life+15); }
                        else if(dist < 75) { score += 250; stats.great++; showJudgment("GREAT", "#ffcc00"); life = Math.min(1000, life+5); }
                        else { score += 100; stats.meh++; showJudgment("MEH", "#888"); }
                        combo++; notes.splice(i, 1); lifeBar.style.width = (life/10) + "%";
                        break; 
                    }
                }
            }
        }
    });

    function end() {
        gameActive = false; audio.pause();
        document.getElementById('gameContainer').style.display = 'none';
        document.getElementById('resultScreen').style.display = 'block';
        document.getElementById('finalRank').innerText = rankDisplay.innerText;
        document.getElementById('resStats').innerHTML = `
            <b style="color:#00ffee">PERFECT: ${stats.perfect}</b><br>
            <b style="color:#ffcc00">GREAT: ${stats.great}</b><br>
            <b style="color:#888">MEH: ${stats.meh}</b><br>
            <b style="color:red">MISS: ${stats.miss}</b><br><br>
            <b style="font-size:20px">SKOR: ${score}</b>
        `;
    }
</script>
</body>
</html>
